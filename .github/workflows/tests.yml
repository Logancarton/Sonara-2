name: Sonara 2 Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Focused and integration tests
        run: python -m pytest -q

      - name: Compile
        run: python -m compileall -q sonara tests examples

      - name: Live cascade gate
        run: python -m examples.first_cascade
